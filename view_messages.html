<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - AuraCode</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>إدارة الرسائل - AuraCode</h2>
        
        <form method="POST" action="/admin/messages">
            <input type="password" name="password" placeholder="أدخل كلمة السر" required>
            <button type="submit">دخول</button>
        </form>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
    </div>

    {% if messages %}
        <table border="1" style="width: 80%; margin: 20px auto; margin-top: 30px;">
            <tr>
                <th>الاسم</th>
                <th>البريد</th>
                <th>الموضوع</th>
                <th>الرسالة</th>
            </tr>
            {% for msg in messages %}
            <tr>
                <td>{{ msg[1] }}</td>
                <td>{{ msg[2] }}</td>
                <td>{{ msg[3] }}</td>
                <td>{{ msg[4] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% endif %}
</body>
</html>
