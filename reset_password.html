<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
           body { 
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
       .container
        {
    
         width: 350px;
         padding: 40px;
         border-radius: 20px;
         text-align: center;
          color: white;
         background: rgba(20, 25, 35, 0.7); 
         backdrop-filter: blur(15px);        
         -webkit-backdrop-filter: blur(15px) ;  
         border: 1px solid rgba(255, 255, 255, 0.2) ;
         
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid #3686cb;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid #4a5568; 
            color: white; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px;
            background: linear-gradient(90deg, #3182ce, #63b3ed); 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
        }

        button:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="{{ url_for('static', filename='1782497026912.png') }}" alt="Logo">
        </div>
        
        <h2>تعيين كلمة مرور جديدة</h2>
        <form method="POST">
            <input type="password" name="password" placeholder="كلمة المرور الجديدة" required>
            <input type="password" name="confirm_password" placeholder="تأكيد كلمة المرور" required>
            <button type="submit">تحديث كلمة المرور</button>
        </form>
    </div>
</body>
</html>
