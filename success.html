<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إرسال رابط الاستعادة - AuraCode</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .container h2 {
            line-height: 1.45;
        }

        .container p {
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .container {
                padding: 24px 18px;
                border-radius: 16px;
            }

            .container h2 {
                font-size: 19px;
            }

            .container p {
                font-size: 13.5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>تم إرسال رابط الاستعادة - AuraCode</h2>
        <p>لقد قمنا بإرسال رسالة إلى بريدك الإلكتروني تحتوي على رابط إعادة تعيين كلمة المرور في AuraCode.</p>
        
        <a href="{{ url_for('reset_password', token=token) }}" class="btn">الانتقال لتعيين كلمة المرور</a>
    </div>
</body>
</html>
