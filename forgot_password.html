<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>استعادة كلمة المرور - AuraCode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            width: 350px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            background: rgba(20, 25, 35, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid #3686cb;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #4a5568;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(90deg, #3182ce, #63b3ed);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="{{ url_for('static', filename='1782497026912.png') }}" alt="AuraCode Logo">
        </div>
        <h2>استعادة كلمة المرور - AuraCode</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="البريد الإلكتروني" required>
            <button type="submit">إرسال</button>
            <a href="{{ url_for('home') }}" class="home-btn">العودة للرئيسية</a>
        </form>
    </div>
</body>
</html>
