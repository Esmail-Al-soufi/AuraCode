<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - Alchemist World</title>
    <style>
        body {
            background-image: url('background.jpg');
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            max-width: 900px;
            margin: auto;
        }
        .logo {
            width: 120px;
            height: auto;
            display: block;
            margin: 0 auto 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: right;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="شعار Alchemist World" class="logo">
        <h1>لوحة تحكم إعدادات المالك</h1>

        <div class="stats">
            <h3>الإحصائيات</h3>
            <p>إجمالي المستخدمين: {{ user_count }}</p>
        </div>

        <div class="messages">
            <h3>الرسائل الواردة</h3>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>البريد الإلكتروني</th>
                        <th>الموضوع</th>
                        <th>الرسالة</th>
                    </tr>
                </thead>
                <tbody>
                    {% for msg in messages %}
                    <tr>
                        <td>{{ msg[1] }}</td>
                        <td>{{ msg[2] }}</td>
                        <td>{{ msg[3] }}</td>
                        <td>{{ msg[4] }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4">لا توجد رسائل حالياً.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
